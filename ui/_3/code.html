<body class="bg-background text-on-background min-h-screen pb-24">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-40 bg-background flex justify-between items-center px-margin-mobile h-16">
<button class="text-primary text-2xl hover:bg-surface-variant transition-colors p-2 rounded-full active:scale-95 duration-200" onclick="window.history.back()">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="text-primary text-body-lg font-semibold">新增剧目</h1>
<button class="text-primary text-2xl hover:bg-surface-variant transition-colors p-2 rounded-full active:scale-95 duration-200">
<span class="material-symbols-outlined" data-icon="check">check</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="px-margin-mobile pt-[86px] pb-6 space-y-8 flex flex-col items-center max-w-lg mx-auto w-full">
<!-- Photo Upload Section -->
<section class="w-full flex justify-center pt-6">
<button class="relative w-36 h-36 rounded-full bg-surface-container border-2 border-dashed border-outline-variant hover:border-primary transition-colors flex flex-col items-center justify-center gap-2 group focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background">
<div class="w-12 h-12 rounded-full bg-primary-container/30 flex items-center justify-center text-primary group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-[28px]" data-icon="add_a_photo">add_a_photo</span>
</div>
<span class="text-label-sm text-on-surface-variant font-medium">上传海报</span>
</button>
</section>
<!-- Form Section -->
<section class="w-full flex flex-col gap-2">
<label class="text-body-md font-semibold text-primary px-1 block" for="play-name">剧目名称</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-[5px] px-4 py-3.5 text-body-lg text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all placeholder:text-on-surface-variant/50 shadow-sm" id="play-name" placeholder="请输入剧目名称" type="text">
</section><section class="w-full flex flex-col gap-2">
<label class="text-body-md font-semibold text-primary px-1 block" for="play-type">剧目类型</label>
<div class="relative">
<select class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-[5px] px-4 py-3.5 text-body-lg appearance-none focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all shadow-sm text-on-surface-variant/50" id="play-type" onchange="this.classList.toggle('text-on-surface-variant/50', this.value === ''); this.classList.toggle('text-on-surface', this.value !== '')">
<option disabled="" hidden="" selected="" value="">请选择剧目类型</option>
<option class="text-on-surface" value="musical-cn">中国音乐剧</option>
<option class="text-on-surface" value="musical-non-cn">非中音乐剧</option>
<option class="text-on-surface" value="drama">话剧</option>
<option class="text-on-surface" value="dance-drama">舞剧</option>
</select>

</div>
</section>
<section class="w-full flex flex-col gap-2">

<input class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-[5px] px-4 py-3.5 text-body-lg text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all placeholder:text-on-surface-variant/50 shadow-sm" id="production-company" placeholder="请输入出品方" type="text">
</section>
<section class="w-full flex flex-col gap-2">
<label class="text-body-md font-semibold text-primary px-1 block" for="plot-intro">剧情介绍</label>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-[5px] px-4 py-3.5 text-body-lg text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all placeholder:text-on-surface-variant/50 shadow-sm min-h-[120px] resize-none" id="plot-intro" placeholder="请输入剧情介绍"></textarea>

<span class="text-label-sm font-label-sm mt-0.5">统计</span>
</a></nav>
