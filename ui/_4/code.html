<script>
      (function() {
        const input = document.getElementById('play-name-input');
        const dropdown = document.getElementById('play-dropdown');
        const options = Array.from(dropdown.children);
        let selected = false;
        input.addEventListener('focus', () => dropdown.classList.remove('hidden'));
        input.addEventListener('input', (e) => {
          const val = e.target.value.toLowerCase();
          selected = false;
          dropdown.classList.remove('hidden');
          options.forEach(opt => {
            const match = opt.textContent.toLowerCase().includes(val);
            opt.style.display = match ? 'block' : 'none';
          });
        });
        options.forEach(opt => {
          opt.addEventListener('mousedown', (e) => {
            input.value = opt.textContent;
            selected = true;
            dropdown.classList.add('hidden');
          });
        });
        input.addEventListener('blur', () => {
          setTimeout(() => {
            if (!selected) input.value = '';
            dropdown.classList.add('hidden');
          }, 200);
        });
      })();
    </script>

<script>
    document.querySelectorAll('#rating-container > div').forEach(row => {
        const stars = row.querySelectorAll('span.material-symbols-outlined');
        stars.forEach(star => {
            star.addEventListener('click', () => {
                const val = parseInt(star.getAttribute('data-val'));
                stars.forEach(s => {
                    if (parseInt(s.getAttribute('data-val')) <= val) {
                        s.classList.remove('text-outline-variant');
                        s.classList.add('text-primary', 'fill');
                    } else {
                        s.classList.add('text-outline-variant');
                        s.classList.remove('text-primary', 'fill');
                    }
                });
            });
        });
    });
</script>
